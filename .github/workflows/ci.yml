# CI pipeline: build the Astro site into an nginx image in GitHub Actions, deploy by pull.
# The `astro build` inside the image is the gate — a broken build never pushes an image.
name: CI

on:
  push:
    branches: [main]

# Only one CI run per ref may be in flight.
#
# Each run pins Dokploy to its OWN commit (`dockerImage: ...sha-${{ github.sha }}`)
# and then deploys. Without this group, merges in quick succession race and the last
# application.update to arrive wins regardless of age — on 2026-09-01 that left bcz-app
# running a commit older than three merged PRs, while every run reported deploy: success.
#
# Queue rather than cancel on the deploy branch: the deploy job loops over more than one
# Dokploy application (web and worker), so cancelling mid-loop could leave them pinned to
# different images. The newest run therefore always deploys last. Superseded pull-request
# runs are cancelled — nothing deploys there.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/michal-cecko/stevano-web:latest
            ghcr.io/michal-cecko/stevano-web:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Pin app to the new image and deploy (pull, no host build)
        env:
          API: ${{ secrets.DOKPLOY_URL }}
          KEY: ${{ secrets.DOKPLOY_API_KEY }}
          IMG: ghcr.io/michal-cecko/stevano-web:sha-${{ github.sha }}
        run: |
          set -e
          APP=v08DMGOTwg5IPWZZM-XXa
          curl -sf -X POST -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP\",\"dockerImage\":\"$IMG\"}" \
            "$API/api/application.update" > /dev/null
          curl -sf -X POST -H "x-api-key: $KEY" -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$APP\"}" \
            "$API/api/application.deploy" > /dev/null
          echo "deployed $APP -> $IMG"
